name: pytest (backend)

# Runs the backend unit-test suite (scopesnap-api/tests). These are pure
# logic tests (no DB fixture / conftest), incl. test_fault_estimate_v2.py
# which covers the Day-1-5 per-tier line-item + replacement-breakdown logic.

on:
  push:
    paths:
      - 'scopesnap-api/**'
      - '.github/workflows/pytest.yml'
  pull_request:
    paths:
      - 'scopesnap-api/**'

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scopesnap-api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio
      - name: Run pytest
        run: python -m pytest --tb=short -q
