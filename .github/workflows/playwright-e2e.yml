name: Stage 3 Playwright E2E

# Runs the Brand Decoder Stage 3 single-screen-UX e2e + axe-a11y suite on every
# push that touches the frontend. The specs are backend-independent: all API
# calls are mocked with page.route() and the real components mount via dev-only
# /test-harness/* routes, so no Clerk/SSO or live FastAPI backend is needed.
#
# DEC-065 note: this repo intentionally ships NO package-lock.json (a committed
# lockfile breaks Vercel `npm ci`). We therefore use `npm install` (not ci) and
# install the Playwright dev-deps here in CI rather than in package.json.

on:
  push:
    branches: [staging, main]
    paths:
      - "scopesnap-web/**"
      - ".github/workflows/playwright-e2e.yml"
  pull_request:
    paths:
      - "scopesnap-web/**"
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: scopesnap-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install app dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright + axe-core
        run: npm install -D @playwright/test@1.61.0 @axe-core/playwright --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Stage 3 e2e + a11y
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: scopesnap-web/playwright-report
          retention-days: 7
