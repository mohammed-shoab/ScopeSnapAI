name: Keepalive Supabase (Workflow B)
on:
  schedule:
    - cron: "0 14 * * 3"  # Wednesday 14:00 UTC
  workflow_dispatch:
jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping production Supabase
        run: |
          curl --fail --silent --show-error \
            -H "apikey: ${{ secrets.SUPABASE_PROD_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_PROD_ANON_KEY }}" \
            "${{ secrets.SUPABASE_PROD_URL }}/rest/v1/brands?select=id&limit=1" \
            > /dev/null
      - name: Ping staging Supabase
        run: |
          curl --fail --silent --show-error \
            -H "apikey: ${{ secrets.SUPABASE_STAGING_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_STAGING_ANON_KEY }}" \
            "${{ secrets.SUPABASE_STAGING_URL }}/rest/v1/brands?select=id&limit=1" \
            > /dev/null
      - name: Heartbeat (Healthchecks.io)
        if: success()
        run: |
          curl --fail --silent --max-time 10 \
            "${{ secrets.HEALTHCHECKS_WORKFLOW_B_URL }}" > /dev/null \
            && echo "Heartbeat sent" \
            || echo "Heartbeat send failed (non-blocking)"
